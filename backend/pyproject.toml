[project]
name = "prabuddh-me-backend"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "akismet>=25.10,<26",
    "django>=5.2.17,<5.3",
    "django-environ>=0.14.0,<0.15",
    "gunicorn>=26.2.0,<27",
    "wagtail>=7.4.3,<7.5",
    "wagtail-headless-preview>=0.9.0,<0.10",
    "whitenoise>=6.12.0,<7",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9,<0.17",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
